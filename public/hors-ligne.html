<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — Dawaana</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: #f7f4ee;
        color: #1c1e29;
        font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
        line-height: 1.6;
        box-sizing: border-box;
      }
      .card {
        max-width: 26rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.02em; }
      p { margin: 0; color: #52566a; font-size: 0.95rem; }
      button {
        margin-top: 0.5rem;
        border: 0;
        background: #f0653e;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="" />
      <h1>Pas de connexion</h1>
      <p>
        Dawaana a besoin d'internet pour afficher les annonces en cours. Les
        demandes de médicaments changent en permanence — mieux vaut ne rien
        montrer qu'une information périmée.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
